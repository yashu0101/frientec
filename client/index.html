<script>
/* Theme before first paint — a saved choice wins, otherwise follow the OS.
   Inline and synchronous on purpose: anything later flashes the wrong theme. */
(function () {
  try {
    var saved = localStorage.getItem('sf_theme');
    var dark = saved ? saved === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var lang = localStorage.getItem('sf_lang');
    if (lang) document.documentElement.setAttribute('lang', lang);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<script>
/* Registered after load on purpose: a service worker install competing with the
   first render buys nothing and can delay it. Wrapped because a page served over
   plain http (or a browser without support) must not throw here. */
window.addEventListener('load', function () {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/sw.js').catch(function () { /* not fatal */ });
});
</script>
